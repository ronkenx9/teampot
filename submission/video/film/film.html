<script>
/* ============================ time helpers ============================ */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x))

const st=document.getElementById('stage')

/** set transform/opacity/blur in one go */

/* ============================ ACT 3: how it works (canvas) ============================ */

function logoState(t){
  const v=V(t)
  if(t<3.2){
    const rise=E.outExpo(clamp(v/1.6)),settle=E.inOut(clamp((v-1.5)/1.0)),slide=E.inOut(clamp((v-2.5)/0.8))
    const spin=-Math.PI*3.2*(1-E.out(clamp(v/2.6)))+.25
    const idle=Math.sin(v*1.3)*.12*slide
    const exit=E.inC(clamp((V(t)-V(2.85))/0.24))
    return {on:true,x:lerp(960,330,slide),y:lerp(1180,540,rise),s:lerp(lerp(.5,.82,settle),.34,slide)*(1-exit*.25),rx:-.22+.18*(1-rise),ry:spin+idle+slide*.35,rz:.03,o:clamp(v/.35)*(1-exit),b:(1-rise)*6+exit*22}
  }
  if(t>=18.25&&t<26.0){
    const v0=V(18.3),u=clamp((v-v0)/1.25)
    const burst=E.outExpo(u)
    const toLeft=E.inOut(clamp((t-20.4)/0.8)),toMid=E.inOut(clamp((t-22.6)/0.8))
    const x=lerp(lerp(960,630,toLeft),960,toMid),y=lerp(540,420,toMid)
    const s=lerp(lerp(2.6,.95,burst),.45,toLeft)*(1-toMid)+.3*toMid
    const spin=-Math.PI*4*(1-E.out(u))+.2+Math.sin(v*1.1)*.2*toLeft+(v-v0)*.35*toMid
    return {on:true,x,y,s,rx:-.2,ry:spin,rz:.03,o:clamp((v-v0)/.12),b:(1-burst)*18}
  }
  return {on:false}
}

    else if(v>=vc&&v<vc+.24){dir=d;const w=E.outExpo(clamp((v-vc)/.24));off=(1-w)*1100;bl=(1-w)*70}}

}
