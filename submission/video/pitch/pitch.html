<body><svg width="0" height="0" style="position:absolute"><filter id="mb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="mbb" stdDeviation="0 0"/></filter></svg>

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,u)=>a+(b-a)*u
const E={out:u=>1-Math.pow(1-u,3),inC:u=>u*u*u,inOut:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,outExpo:u=>u===1?1:1-Math.pow(2,-10*u),inExpo:u=>u===0?0:Math.pow(2,10*u-10),outBack:u=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)}}
const seg=(t,a,b,e=E.outExpo)=>e(clamp((t-a)/(b-a)))
const st=document.getElementById('stage')

const A='../film/assets/'
const img=(src,cls='',parent=st)=>{const i=el('img',cls,parent);i.src=src;return i}

/* ------------- data ------------- */

    const x=lerp(lerp(fx,tx,u),dx-80,q),y=lerp(lerp(fy,ty,u),728,q);p.style.display=t>=t0-.1&&t<59.8?'block':'none';T(p,{x,y,o:u*(1-q*.85)*(1-seg(t,59.2,59.7)),s:lerp(1,.55,q),b:(1-u)*10})})

/* ------------- the speaker: picture + sound rings ------------- */
const ringSvg=el('div','abs',st,`<svg width="1920" height="1080" style="overflow:visible"><g id="rings"></g></svg>`);css(ringSvg,{inset:'0',pointerEvents:'none'})
const rings=ringSvg.querySelector('#rings')
const NR=14;const ripple=[...Array(NR)].map(()=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('fill','none');rings.appendChild(c);return c})
const halo=[...Array(3)].map((_,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('fill','none');rings.appendChild(c);return c})
const face=img('pfp.webp','abs');css(face,{left:'0',top:'0',width:'400px',height:'400px',borderRadius:'50%',objectFit:'cover',boxShadow:'0 30px 70px rgba(20,30,50,.22)',transformOrigin:'0 0'})
const env=t=>{if(!ENV)return 0;const i=Math.floor(t*ENV.fps);return ENV.env[Math.min(ENV.env.length-1,Math.max(0,i))]||0}
// where the picture sits: centre for intro / "customer #1", corner otherwise
function speaker(t){
  const C={x:960,y:420,r:170},K={x:1745,y:905,r:92}
  const toK=seg(t,7.8,8.7,E.inOut)*(1-seg(t,95.5,96.4,E.inOut))+seg(t,106.9,107.8,E.inOut)
  const k=clamp(toK);const c10=t>=95.5&&t<107.8
  const C2=c10?{x:960,y:520,r:180}:C
  return {x:lerp(C2.x,K.x,k),y:lerp(C2.y,K.y,k),r:lerp(C2.r,K.r,k)}
}
function drawSpeaker(t){
  const p=speaker(t),a=env(t),intro=seg(t,0,.6)
  css(face,{transform:`translate(${p.x-p.r}px,${p.y-p.r}px) scale(${(2*p.r)/400})`,opacity:intro})
  halo.forEach((c,i)=>{const rr=p.r+10+i*12+a*(14+i*10);c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',rr);c.setAttribute('stroke',i===0?'#E8552D':'#0A0A0B');c.setAttribute('stroke-width',i===0?3:1.5);c.setAttribute('opacity',(i===0?.85:.18-i*.04)*intro*(.35+a*.65))})
  const P=.16 // a ripple every 0.16 s, strength = voice level when it was born
  ripple.forEach((c,j)=>{const born=Math.floor(t/P)*P-j*P,age=t-born,life=NR*P;const s=env(born);const u=age/life
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',p.r+14+u*(p.r*.9+60));c.setAttribute('stroke',j%3===0?'#E8552D':'#0A0A0B');c.setAttribute('stroke-width',1.6);c.setAttribute('opacity',(s>.12?s:0)*(1-u)*(j%3===0?.55:.25)*intro)})
}

/* ------------- captions ------------- */
const capEl=el('div','cap')
let CH=[]
function buildChunks(){CH=[];let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const end=/[.,?!]$/.test(w[2])||cur.length>=7;if(end){CH.push(cur);cur=[]}});if(cur.length)CH.push(cur)}
function drawCaption(t){
  const c=CH.find((ch,i)=>t>=ch[0][0]-.05&&t<(CH[i+1]?CH[i+1][0][0]-.05:ch[ch.length-1][1]+.6))
  if(!c||t>110){capEl.style.opacity=0;return}
  capEl.innerHTML=c.map(w=>`<span style="color:${t>=w[0]?'#0A0A0B':'rgba(10,10,11,.28)'}">${w[2]}</span>`).join(' ')
  const corner=speaker(t).r<120
  capEl.style.opacity=1
  if(corner){css(capEl,{left:'150px',right:'auto',textAlign:'left',transform:'none'})}else{css(capEl,{left:'50%',right:'auto',textAlign:'center',transform:'translateX(-50%)'})}
  capEl.style.bottom=(t>=95.5&&t<107.8)?'40px':'72px'
}

/* ------------- quick whips between big beats ------------- */
const WH=[[35.7,'left'],[48.4,'up'],[62.2,'left'],[76.3,'left'],[86.1,'up']]
const cam=document.createElement('div');cam.className='abs';cam.style.inset='0'
function whip(t){let off=0,bl=0,dir=null
  for(const [c,d] of WH){if(t>=c-.28&&t<c){dir=d;const n=E.inOut(clamp((t-(c-.28))/.12)),w=E.inC(clamp((t-(c-.16))/.16));off=n*30-w*900;bl=w*60}else if(t>=c&&t<c+.22){dir=d;const w=E.outExpo(clamp((t-c)/.22));off=(1-w)*900;bl=(1-w)*60}}
  const h=dir==='left';cam.style.transform=dir?(h?`translate3d(${off}px,0,0)`:`translate3d(0,${off}px,0)`):'none'
  document.getElementById('mbb').setAttribute('stdDeviation',h?`${bl.toFixed(1)} 0`:`0 ${bl.toFixed(1)}`);cam.style.filter=bl>.3?'url(#mb)':'none'}

let built=false
window.VDUR=114.6
window.seek=function(t){
  if(!built){built=true;// scene layers go inside the whip camera; speaker + captions stay fixed on top
    [...st.children].filter(c=>c!==ringSvg&&c!==face&&c!==capEl).forEach(c=>cam.appendChild(c));st.insertBefore(cam,ringSvg)}
  scenes.forEach(f=>f(t));whip(t);drawSpeaker(t);drawCaption(t)
}
window.ready=Promise.all([document.fonts.ready,fetch('env.json').then(r=>r.json()).then(j=>ENV=j),fetch('words-fixed.json').then(r=>r.json()).then(j=>{WORDS=j;buildChunks()}),...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))]).then(()=>{seek(0);return true})
</script></body></html>
